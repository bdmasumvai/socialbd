{% extends 'base.html' %}
{% load static %}

{% block title %}প্রোফাইল সম্পাদনা - SocialBD{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width:700px">
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <h4 class="fw-bold mb-4">প্রোফাইল সম্পাদনা</h4>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-medium">নাম</label>
                    <input type="text" name="first_name" class="form-control rounded-3" value="{{ user.first_name }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">শেষ নাম</label>
                    <input type="text" name="last_name" class="form-control rounded-3" value="{{ user.last_name }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-medium">নিজের সম্পর্কে</label>
                    <textarea name="bio" class="form-control rounded-3" rows="3" placeholder="আপনার সম্পর্কে কিছু লিখুন...">{{ user.bio|default:'' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">অবস্থান</label>
                    <input type="text" name="location" class="form-control rounded-3" value="{{ user.location|default:'' }}" placeholder="ঢাকা, বাংলাদেশ">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">ওয়েবসাইট</label>
                    <input type="url" name="website" class="form-control rounded-3" value="{{ user.website|default:'' }}" placeholder="https://...">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">জন্ম তারিখ</label>
                    <input type="date" name="date_of_birth" class="form-control rounded-3" value="{{ user.date_of_birth|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium">প্রোফাইল ছবি</label>
                    <input type="file" name="profile_picture" class="form-control rounded-3" accept="image/*">
                </div>
                <div class="col-12">
                    <label class="form-label fw-medium">কভার ফটো</label>
                    <input type="file" name="cover_photo" class="form-control rounded-3" accept="image/*">
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-sbd rounded-3 px-4">
                    <i class="fas fa-save me-2"></i>সংরক্ষণ করুন
                </button>
                <a href="{% url 'profile' user.username %}" class="btn btn-light rounded-3 px-4">বাতিল</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
